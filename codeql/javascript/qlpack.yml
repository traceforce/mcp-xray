name: traceforce/mcp-codeql-javascript
version: 0.1.0
# The MCP taint query pack (JavaScript/TypeScript). Deterministic: MCP handler
# callback parameters + request.params.arguments as sources, static per-class sinks,
# and CodeQL's interprocedural taint. The JS/TS extractor is BUILD-FREE (it parses
# source, never compiles or executes the target), so this stays within the static
# phase's no-build/no-execute contract. codeql/javascript-all is provided offline by
# the CodeQL bundle at analyze time (the adapter passes --search-path to the bundle).
#
# Version pin = the exact javascript-all shipped in the pinned bundle (v2.25.6). NOTE:
# `--search-path` resolution does NOT enforce this constraint, so the real determinism
# levers are (1) the SHA-pinned bundle in scripts/install_codeql.sh and (2) the
# version-assert in .github/workflows/codeql-pack-ci.yml. This line documents the
# tested version.
dependencies:
  codeql/javascript-all: 2.7.2
